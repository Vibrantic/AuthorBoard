name: "🐛 Bug Report"
description: "Report a crash, an error, or something that isn't working as expected."
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! 
        
        ⚠️ **Privacy Warning:** Please do *not* upload your real notebooks (`.json` files). If you need to provide a sample file, please create a dummy notebook with placeholder text.

  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: A clear and concise description of what the bug is.
      placeholder: "Example: The app crashes when I try to connect two notes with a thread."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open a notebook.
        2. Create two notes.
        3. Right-drag from a pin...
        4. See error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "A thread should connect the two pins."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AuthorBoard Version
      description: "Found in Help -> About AuthorBoard, or in the title bar."
      placeholder: "e.g., 1.2.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which OS are you running?
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other (please specify in the description)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Log / Crash Output
      description: |
        If the app crashed, please paste the error message here. 
        If you have an `update.log` from a failed update, you can paste it here.
        (Format this text as code by wrapping it in triple backticks \`\`\`).
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/Vibrantic/AuthorBoard/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
